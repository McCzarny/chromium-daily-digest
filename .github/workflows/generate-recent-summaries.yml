name: Recent Daily Summaries (Manual)

on:
  # This workflow is only run manually from the Actions tab
  workflow_dispatch:
    inputs:
      days:
        description: 'How many past days to check (max 5)'
        required: false
        default: '5'
      config:
        description: 'Config file (leave empty for default summaries, e.g. config.on-top-of-chromium.json)'
        required: false
        default: ''
      branch:
        description: 'Chromium branch to summarize'
        required: false
        default: 'main'
      provider:
        description: 'LLM provider to use (overrides config and the default gemini)'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - gemini
          - opencode
          - nexos

# Sets permissions of the SECRET_GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write # To push the generated summary files back to the repo
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Generate missing summaries for the last days
        env:
          SECRET_GEMINI_API_KEY: ${{ secrets.SECRET_GEMINI_API_KEY }}
          SECRET_GITHUB_TOKEN: ${{ secrets.SECRET_GITHUB_TOKEN }}
          SECRET_NEXOS_TOKEN: ${{ secrets.SECRET_NEXOS_TOKEN }}
          SECRET_OPENCODE_API_KEY: ${{ secrets.SECRET_OPENCODE_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days }}"
          CONFIG="${{ github.event.inputs.config }}"
          BRANCH="${{ github.event.inputs.branch }}"
          PROVIDER="${{ github.event.inputs.provider }}"

          DAYS="${DAYS:-5}"
          BRANCH="${BRANCH:-main}"
          PROVIDER="${PROVIDER:-default}"

          if [ -n "$PROVIDER" ] && [ "$PROVIDER" != "default" ]; then
            echo "Using LLM provider: $PROVIDER"
            export LLM_PROVIDER="$PROVIDER"
          fi

          if ! [[ "$DAYS" =~ ^[0-9]+$ ]] || [ "$DAYS" -lt 1 ]; then
            echo "::error::'days' must be a positive integer (got '$DAYS')"
            exit 1
          fi

          if [ "$DAYS" -gt 5 ]; then
            echo "Limiting lookback to 5 days (requested $DAYS)"
            DAYS=5
          fi

          # Resolve the output directory from the config's outputPath (defaults to public/summaries)
          OUTPUT_PATH=""
          if [ -n "$CONFIG" ]; then
            OUTPUT_PATH=$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(c.outputPath||'')" "$CONFIG" || true)
          fi
          DIR="public/summaries${OUTPUT_PATH:+/$OUTPUT_PATH}"

          echo "Checking the last $DAYS day(s) for missing summaries in $DIR"

          for i in $(seq 1 "$DAYS"); do
            DATE=$(date -d "$i days ago" +'%Y-%m-%d')

            if [ -f "$DIR/$DATE.html" ]; then
              echo "Skipping $DATE - summary already exists"
              continue
            fi

            echo "Generating summary for $DATE..."
            if npm exec tsx scripts/generate-page.ts "$DATE" "$BRANCH" "$CONFIG"; then
              echo "Generated summary for $DATE"
            else
              echo "::warning::Failed to generate summary for $DATE"
            fi
          done
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Check if there are changes to commit
          if [[ -z $(git status -s) ]]; then
            echo "No changes to commit."
          else
            git add public/summaries
            git commit -m "docs: Add recent daily summaries"
            git pull --rebase
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the generated summaries directory
          path: './public/summaries'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
